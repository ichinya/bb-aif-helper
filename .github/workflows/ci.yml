name: CI and version tag

on:
  pull_request:
  push:
    branches: [main, dev, 'check/**']

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      BB_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      # Real machines have temp folders and profiles with spaces and non-Latin letters; tests run in one such folder.
      - name: Use a temp folder with a space and Cyrillic
        shell: bash
        run: |
          dir="$RUNNER_TEMP/aif temp ё"
          mkdir -p "$dir"
          { echo "TMPDIR=$dir"; echo "TMP=$dir"; echo "TEMP=$dir"; } >> "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm test
      # A pinned BB CLI can build a plugin without starting a server.
      - run: npm exec --yes --package=bb-app@0.49.0 -- bb plugin build .

  tag:
    name: Tag package version
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'ichinya/bb-aif-helper'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: version-tag-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      # No npm install or plugin execution in this write-enabled job.
      - name: Create an immutable version tag if missing
        run: node .github/scripts/tag-version.mjs
